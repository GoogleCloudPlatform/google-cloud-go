// gcscore.proto — local IPC contract between a thin language client and the
// Rust "thick" GCS core running as a sidecar on the same machine (gRPC over a
// Unix Domain Socket). POC scope: ReadObject, WriteObject, ListObjects on the
// JSON path and the gRPC CloudPath (BidiRead / appendable BidiWrite), plus the
// handle-based range reads needed for the Rapid workload SLIs.
syntax = "proto3";

package gcscore.v1;

option go_package = "poc/gothin/udsthin/gcscorepb;gcscorepb";

service GcsCore {
  // Round-trip microbenchmark; echoes `payload`.
  rpc Ping(PingRequest) returns (PingResponse);

  // One-shot (range) read. First chunk carries object metadata.
  rpc ReadObject(ReadObjectRequest) returns (stream ReadChunk);

  // gRPC BidiReadObject session: open once, then issue many ReadRange calls.
  rpc OpenObject(OpenObjectRequest) returns (OpenObjectResponse);
  rpc ReadRange(ReadRangeRequest) returns (stream ReadChunk);
  rpc CloseObject(CloseObjectRequest) returns (Empty);

  // Client-streaming upload. First message must carry `header`.
  rpc WriteObject(stream WriteRequest) returns (WriteObjectResponse);

  // One page per call (mirrors ObjectIterator / BucketIterator / PageInfo).
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);
  rpc ListBuckets(ListBucketsRequest) returns (ListBucketsResponse);

  // Shared-memory data plane experiment: the client first obtains a memfd for
  // a region over the side channel (<socket>.shm, SCM_RIGHTS) and mmaps it;
  // the server then writes object bytes straight into the region and streams
  // only (offset, len) descriptors. gRPC is control plane only.
  rpc ReadObjectShm(ReadObjectShmRequest) returns (stream ShmChunk);

  // Per-caller credentials. The app obtains short-lived OAuth2 access tokens
  // from its own TokenSource and lends them to the sidecar for a session;
  // every data RPC carries the session id in metadata "x-session". A session
  // is bound to the UID *and PID* that created it (SO_PEERCRED).
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc UpdateToken(UpdateTokenRequest) returns (Empty);
  rpc CloseSession(SessionRef) returns (Empty);

  // Resource usage of the sidecar process (so the caller can account for it).
  rpc Stats(StatsRequest) returns (StatsResponse);

  rpc Shutdown(Empty) returns (Empty);
}

message Empty {}

enum Transport {
  TRANSPORT_UNSPECIFIED = 0;
  JSON = 1;  // storage.googleapis.com JSON API over HTTP/1.1 (reqwest)
  GRPC = 2;  // storage.googleapis.com gRPC v2 over CloudPath (tonic)
}

message PingRequest { bytes payload = 1; }
message PingResponse { bytes payload = 1; }

message ObjectMeta {
  int64 size = 1;
  int64 generation = 2;
  int64 metageneration = 3;
  string content_type = 4;
  string content_encoding = 5;
  uint32 crc32c = 6;
}

message ReadObjectRequest {
  string bucket = 1;
  string object = 2;
  int64 offset = 3;               // storage.NewRangeReader semantics
  int64 length = 4;               // -1 = to end
  int64 generation = 5;           // 0 = latest
  int64 if_generation_match = 6;  // -1 = unset
  Transport transport = 7;
  uint32 chunk_size = 8;          // bytes per ReadChunk; 0 = server default
}

message ReadChunk {
  // Several pieces instead of one blob: the server forwards the crate's
  // buffers as-is (no concatenation copy); the client consumes them in order.
  repeated bytes data = 1;
  ObjectMeta meta = 2;  // set on the first chunk only
}

message ReadObjectShmRequest {
  ReadObjectRequest read = 1;
  uint64 region = 2;       // id returned on the .shm side channel
  uint64 base_offset = 3;  // where in the region to start writing
  uint64 capacity = 4;     // bytes available from base_offset
}
message ShmChunk {
  uint64 offset = 1;  // absolute offset in the region
  uint64 len = 2;
  ObjectMeta meta = 3;  // first chunk only
}

message OpenObjectRequest {
  string bucket = 1;
  string object = 2;
  int64 generation = 3;
}
message OpenObjectResponse {
  uint64 handle = 1;
  ObjectMeta meta = 2;
}
message ReadRangeRequest {
  uint64 handle = 1;
  int64 offset = 2;
  int64 length = 3;
  uint32 chunk_size = 4;
}
message CloseObjectRequest { uint64 handle = 1; }

message WriteHeader {
  string bucket = 1;
  string object = 2;
  string content_type = 3;
  int64 if_generation_match = 4;  // -1 unset; 0 = DoesNotExist
  int64 known_size = 5;           // >= 0 lets the JSON path pick single-shot
  uint32 chunk_size = 6;          // resumable/append flush size; 0 = default
  Transport transport = 7;
}
message WriteRequest {
  oneof msg {
    WriteHeader header = 1;
    bytes data = 2;
  }
}
message WriteObjectResponse {
  int64 size = 1;
  int64 generation = 2;
  uint32 crc32c = 3;
}

message ListObjectsRequest {
  string bucket = 1;
  string prefix = 2;
  string delimiter = 3;
  string start_offset = 4;
  string end_offset = 5;
  string page_token = 6;
  int32 page_size = 7;
  bool versions = 8;
}
message ListedObject {
  string name = 1;
  int64 size = 2;
  int64 generation = 3;
  int64 metageneration = 4;
  string content_type = 5;
  string storage_class = 6;
  int64 updated_unix_secs = 7;
  uint32 crc32c = 8;
}
message ListObjectsResponse {
  repeated ListedObject items = 1;
  repeated string prefixes = 2;
  string next_page_token = 3;
}

message ListBucketsRequest {
  string project = 1;
  string prefix = 2;
  string page_token = 3;
  int32 page_size = 4;
}
message ListedBucket {
  string name = 1;
  string location = 2;
  string storage_class = 3;
  int64 metageneration = 4;
  int64 created_unix_secs = 5;
}
message ListBucketsResponse {
  repeated ListedBucket items = 1;
  string next_page_token = 2;
}

message CreateSessionRequest {
  string access_token = 1;      // OAuth2 bearer token (never a key file)
  int64 expiry_unix_secs = 2;
  string quota_project = 3;
}
message CreateSessionResponse { string session_id = 1; }
message UpdateTokenRequest {
  string session_id = 1;
  string access_token = 2;
  int64 expiry_unix_secs = 3;
}
message SessionRef { string session_id = 1; }

message StatsRequest { bool reset_peak_rss = 1; }
message StatsResponse {
  int32 pid = 1;
  double cpu_user_secs = 2;
  double cpu_sys_secs = 3;
  int64 rss_bytes = 4;       // VmRSS
  int64 peak_rss_bytes = 5;  // VmHWM (since last reset)
  int32 threads = 6;
  int64 uptime_ms = 7;
  int64 rpcs_served = 8;
}
